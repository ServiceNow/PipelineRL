  - TAU2_AUXILIARY_MODEL_TIMEOUT_S=PENDING_APPROVED_CALIBRATION_AUXILIARY_TIMEOUT_S
  - TAU2_TRAINER_GPU_MEMORY_BYTES=PENDING_APPROVED_TRAINER_GPU_MEMORY_BYTES
  - TAU2_AUXILIARY_PLACEMENT=one separately managed restartable Qwen3.5-27B EAI vLLM service; no calibration-job GPUs
  - TAU2_AUXILIARY_PROVENANCE=Qwen/Qwen3.5-27B at fc05daec; exact ordered user-then-judge aliases and reviewed artifact SHA256 recorded in the pre-run manifest
  - TAU2_AUXILIARY_SUBMISSION_MODE=restartable alone; no preemptable/non-preemptable CLI flag
  - TAU2_AUXILIARY_MAX_MODEL_LEN=PENDING_LARGER_ROLE_PROMPT_HEADROOM_PLUS_GENERATION_RESERVE
  - TAU2_AUXILIARY_ROLE_EVIDENCE=PENDING_USER_AND_JUDGE_PROMPT_LATENCY_HEADROOM_RESERVE_DISTRIBUTIONS
  - TAU2_AUXILIARY_SNAPSHOT_HASH_IO=PENDING_EXACT_NON_CACHE_QWEN27_SNAPSHOT_HASH_BYTES
  - TAU2_AUXILIARY_BATCH_INVARIANT=0 pending seeded judge determinism evidence
  - TAU2_POLICY_MODEL=Qwen/Qwen3.5-9B@c202236235762e1c871ad0ccb60c8ee5ba337b9a
  - TAU2_MODEL_REVISION_STATUS=VERIFIED_2026-07-30
  - TAU2_POLICY_LOSS=gspo
  - TAU2_POLICY_LOSS_DECISION=Rafa selected GSPO from Wave 6 gate-8 evidence
  - TAU2_POLICY_LOSS_FALLBACK=dppo
  - TAU2_POLICY_LOSS_FALLBACK_TRIGGER=bringup shows drift-attributable instability
  - TAU2_GSPO_TOKEN_UPGRADE_TRIGGER=demonstrated need for nonuniform token credit
  - TAU2_CALIBRATION_SAMPLE_SIZE=192 rollouts / 12 G16 groups
  - TAU2_CALIBRATION_SAMPLE_CAVEAT=small-sample maxima plus headroom; typed whole-group drops remain the runtime safety net
  - TAU2_CALIBRATION_PACKING=false
  - TAU2_CALIBRATION_SEQ_PARALLEL=1
  # Full 262,144-token context avoids biasing the length measurement, but at
  # SP1 a roughly 100-150k+ merged trajectory can OOM the trainer even with
  # optimizer CPU offload. That loud failure is accepted: actor-side length
  # evidence survives on disk. Recover by using those records to qualify gate
  # 5 packing+SP or a larger-memory lane, then rerun without lowering context.
  - TAU2_CALIBRATION_CONTEXT_TOKENS=262144
  - TAU2_CALIBRATION_QUEUE_ENTRY_BYTES=134217728
  - TAU2_CALIBRATION_MEMORY_LEVER=ZeRO-3 BF16 optimizer CPU offload plus one-G16 scheduling; packing remains off
  - TAU2_PARITY_MAX_ABS_TOLERANCE=0.05
  - TAU2_PARITY_TOLERANCE_BASIS=6.4 BF16 epsilons for TP2 cross-implementation noise with FP32 output heads
