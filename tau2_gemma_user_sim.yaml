# Standalone frozen Tau2 user-simulator service. This file is deliberately
# fail-closed until Rafa resolves every PENDING_* serving measurement and
# approves both this exact file and a submission command using --restartable
# alone (no --preemptable or --non-preemptable flag).
image: registry.toolkit-sp.yul201.service-now.com/snow.research.tapes/interactive-toolkit:throughput
data:
  - snow.research.tapes.rafael_pardinas_home:/home/toolkit:rw
  - snow.research.tapes.transformers_cache:/transformers_cache:rw
  - snow.research.tapes.base_models:/mnt/llmd/base_models:ro
command:
  - /opt/conda/bin/conda
  - run
  - -n
  - pipeline-rl
  - --no-capture-output
  - bash
  - -lc
  - >-
    exec python -m vllm.entrypoints.openai.api_server
    --model "${TAU2_USER_SIM_SNAPSHOT}"
    --served-model-name "${TAU2_USER_SIM_MODEL_ALIAS}"
    --dtype bfloat16
    --host 0.0.0.0
    --port 8000
    --tensor-parallel-size "${TAU2_USER_SIM_TP_SIZE}"
    --max-model-len "${TAU2_USER_SIM_MAX_MODEL_LEN}"
    --max-num-seqs "${TAU2_USER_SIM_MAX_NUM_SEQS}"
    --default-chat-template-kwargs '{"enable_thinking": false}'

resources:
  cpu: PENDING_USER_SIM_CPU_COUNT
  gpu: PENDING_MEASURED_USER_SIM_GPU_COUNT
  gpuModel: PENDING_MEASURED_USER_SIM_GPU_TYPE
  mem: PENDING_USER_SIM_MEMORY_GIB
  replicas: 1
options:
  internal-dns:
    name: tau2-user
    ports:
      - {port: 8000, target-port: 8000, protocol: TCP}

name: tau2-gemma-user-sim
# Rafa explicitly keeps the restartable service at the calibration bid.
bid: 9999
interactive: false
preemptable: true
restartable: true
workdir: /home/toolkit/PipelineRL
environmentVars:
  - HOME=/home/toolkit
  - TAU2_USER_SIM_MODEL_ID=google/gemma-4-31B-it
  - TAU2_USER_SIM_REVISION=842da3794eaa0b77d5f08bae87a17459d91ff475
  - TAU2_USER_SIM_MODEL_ALIAS=google/gemma-4-31B-it@842da3794eaa0b77d5f08bae87a17459d91ff475
  - TAU2_USER_SIM_SNAPSHOT=/mnt/llmd/base_models/gemma-4-31B-it
  - TAU2_USER_SIM_GPU_TYPE=PENDING_MEASURED_USER_SIM_GPU_TYPE
  - TAU2_USER_SIM_GPU_COUNT=PENDING_MEASURED_USER_SIM_GPU_COUNT
  - TAU2_USER_SIM_TP_SIZE=PENDING_MEASURED_USER_SIM_TP_SIZE
  # No length number is assumed here. An HTTP 400 from vLLM, including context
  # overflow, propagates through the pinned Tau2 runtime and kills the actor
  # run. Resolve this from measured USER-SIDE prompts plus recorded headroom
  # and generation reserve, never from the policy prompt distribution.
  - TAU2_USER_SIM_MAX_MODEL_LEN=PENDING_MEASURED_USER_SIDE_MAX_MODEL_LEN
  - TAU2_USER_SIM_MAX_NUM_SEQS=PENDING_MEASURED_AGGREGATE_CONCURRENCY
  - TAU2_USER_SIM_THINKING=false
  - TAU2_USER_SIM_SUBMISSION_MODE=restartable
  - TAU2_USER_SIM_SNAPSHOT_HASH_BYTES=PENDING_FULL_SNAPSHOT_HASH_IO_BYTES
  - TAU2_USER_SIM_LENGTH_EVIDENCE=PENDING_USER_SIDE_PROMPT_DISTRIBUTION_HEADROOM_AND_GENERATION_RESERVE
  - TAU2_USER_SIM_CONCURRENCY_EVIDENCE=PENDING_PEAK_IN_FLIGHT_AND_LATENCY_DISTRIBUTION
