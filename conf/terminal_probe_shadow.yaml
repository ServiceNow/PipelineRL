defaults:
  - terminal
  - _self_

# Frozen-probe SHADOW validation run (probe_shadow_01), parallel to the gspo_N
# mainline. Deltas vs terminal.yaml:
#   1. finetune.rl.frozen_probe_credit=shadow + frozen_probe_path: p_t/A_t/auroc_online
#      are computed and logged, advantages stay bit-identical to the z-path.
#   2. Fleet DNS names terminal-envs-probe-{a..d} + fleet_name_prefix so this run's
#      launcher never races gspo_50's fleet manager for the terminal-envs-{a..d} DNS.
# The environments list is restated wholesale because OmegaConf replaces lists on
# merge; every value except external_hosts is copied verbatim from terminal.yaml
# (which stays the source of truth: fleet jobs are launched with --config-name
# terminal, so server-side settings cannot drift).

finetune:
  rl:
    frozen_probe_credit: shadow
    frozen_probe_path: /mnt/llmd/results/exps/rafa/terminal/terminal_qwen35_9b_gspo_45/probe_analysis/frozen_probe_layer31.pt

orchestrator:
  fleet_name_prefix: terminal_envs_probe

environments:
  - key: terminal
    mode: remote
    replicas_per_actor: ${world.env_replicas_per_actor}
    placement: external
    external_hosts:
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-probe-a
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-probe-b
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-probe-c
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-probe-d
    external_start_port: 7777
    external_count: 12
    _target_: pipelinerl.domains.terminal.environment_server.TerminalEnvironmentServer
    bases_dir: ${oc.env:TERMINAL_BASES_DIR,/mnt/llmd/data/terminal_bases}
    cache_dir: ${output_dir}/env_cache
    rootfs_retention_seconds: 600.0
    n_envs: 1
    host: "0.0.0.0"
    proot_bin: ${oc.env:PROOT_BIN,/mnt/llmd/data/terminal_bin/proot}
    nameserver: ${oc.env:TERMINAL_NAMESERVER,10.150.0.10}
    command_timeout: 180.0
    verifier_timeout: 180.0
    max_observation_chars: 4000
    check_initial_state: true
    max_session_disk_bytes: 966367641   # 0.9 GiB
    session_delta_isolation: false
    session_delta_max_bytes: 536870912   # 512 MiB
    contamination_check: true
    contamination_sample_every: 20
    max_session_rss_bytes: 17179869184  # 16 GiB
    session_ttl_seconds: 2800.0
    session_reap_interval_seconds: 60.0
