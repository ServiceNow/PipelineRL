defaults:
  - base
  - cubes: base
  - _self_

output_dir: results/cube_math_tool/${now:%Y-%m-%d}/${now:%H-%M-%S}
model_path: /mnt/llmd/base_models/Qwen2.5-7B-Instruct

actor:
  max_steps: 10
  ray_num_cpus: null
  ray_worker_num_cpus: 0.25
  ray_workers: 128
  ray_options: {}
  eval:
    ray_workers: 64
    resource_policy: elastic_train
    drain_to_target: true
  llm_max_rollouts: 128
  ray_worker_log_enabled: true
  ray_worker_log_path: null
  ray_worker_log_level: WARNING
  ray_worker_litellm_log_level: CRITICAL

  domain_mix:
    miniwob_html: 0.5
    miniwob_axtree: 0.5

llm:
  parameters:
    max_tokens: 16000
    max_completion_tokens: 16000
    temperature: 1.0

test_llm:
  parameters:
    max_tokens: 16000
    max_completion_tokens: 16000
    temperature: 1.0
    top_p: 0.95

vllm_config:
  vllm_kwargs:
    max_model_len: 32000
    served_model_name: Qwen2.5-7B-Instruct
    enable-auto-tool-choice: ""
    tool-call-parser: rl_tool
    tool-parser-plugin: ${hydra:runtime.cwd}/pipelinerl/rl_tool_parser_plugin.py

finetune:
  seq_length: 32000
  seq_parallel: 8
  gradient_accumulation_passes: 1024
  rl:
    policy_loss: gspo
    overlong_filtering: true
    # grpo_loo combines:
    #     A = z_group(R_final) + step_reward_lambda * z_group_step(G_local[t])
    # where
    #     G_local[t] = sum_{u>=t} step_reward_gamma^(u-t) * step_reward[u]
    #
    # step_reward_lambda → relative weight of shaping vs terminal reward.
    #   Lower it (e.g. 0.1) if you want the terminal reward to dominate; set
    #   to 0.0 to disable the local-reward term without touching the env.
    # step_reward_gamma  → how far local credit propagates backward.
    #   1.0 = full credit to every earlier step; <1.0 localizes credit.
    # step_advantage_centering="step" matches the spec's z_group_step:
    #   subtract the mean across sibling rollouts at the SAME step index.
    advantage:
      type: grpo_loo
      step_reward_lambda: 0.1
      step_reward_gamma: 1.0
      step_advantage_centering: step

preprocess:
  input: actor
  output: training_data
  n_workers: 8
  shared_memory_entry_size: 1000000000

train_dataset_names:
  - miniwob_html
test_dataset_names:
  # - miniwob_test

dataset_loader_params:
  miniwob_html:
    benchmark: &miniwob_benchmark
      _type: miniwob_cube.benchmark.MiniWobBenchmarkConfig
      port: 8010
      # Enables the deterministic potential-based local reward shaper
      # (`miniwob_cube.shaping`). Flip to `false` to disable shaping
      # entirely — the terminal MiniWob reward is unaffected either way.
      #
      # `shaping_gamma` is the γ in the Ng/Harada/Russell potential-based
      # shaping rule: local_reward = shaping_gamma * Φ(s') - Φ(s). Keep at
      # 1.0 — GRPO uses undiscounted episode returns here, so the
      # policy-invariance theorem requires this γ to also be 1.0.
      # To downweight shaping vs the terminal reward, lower
      # `finetune.rl.advantage.step_reward_lambda` (not this γ).
      enable_step_verifier_rewards: true
      shaping_weight_constraints: 0.3
      shaping_weight_terminal: 0.7
      shaping_weight_forbidden: 0.3
      shaping_weight_error: 0.1
      shaping_weight_noop: 0.05
      shaping_gamma: 1.0
      tool_config: &miniwob_tool_config
          _type: miniwob_cube.tools.MiniWobBgymToolConfig
          use_html: true
          use_axtree: false
          use_screenshot: false
    agent: &simple_agent
      _type: dev_cubes.agents.SimpleAgentConfig
      llm_config:
        _type: cube_harness.rl.llm.RolloutLLMConfig
        model_name: ${vllm_config.vllm_kwargs.served_model_name}
        tokenizer_name: ${model_path}
        timeout: 3600.0
        num_retries: 1
      max_actions: 10
  miniwob_axtree:
    benchmark:
      <<: *miniwob_benchmark
      port: 8011
      tool_config:
        <<: *miniwob_tool_config
        use_html: false
        use_axtree: true
        use_screenshot: false
    agent: *simple_agent
