defaults:
  - terminal
  - _self_

# Gradient-accumulation A/B arm: identical to probe_shadow_02 (env-v2, shadow
# probe, exec_mode=subprocess) except finetune.gradient_accumulation_passes
# 128 -> 1024, restoring the intentional staleness regime (see the comment on
# the key in terminal.yaml). Runs IN PARALLEL with probe_shadow_02 so the
# accumulation effect is attributable: expect ~8x samples/step, ~2.5h to the
# first optimizer step, and larger actor lag by design.
# Fleet DNS terminal-envs-ga1024-{a..d} + fleet_name_prefix keep this launcher
# clear of probe_shadow_02's fleets. The environments list is restated wholesale
# because OmegaConf replaces lists on merge; identical to terminal.yaml.

finetune:
  gradient_accumulation_passes: 1024
  rl:
    frozen_probe_credit: shadow
    frozen_probe_path: /mnt/llmd/results/exps/rafa/terminal/terminal_qwen35_9b_gspo_45/probe_analysis/frozen_probe_layer31.pt

orchestrator:
  fleet_name_prefix: terminal_envs_ga1024

environments:
  - key: terminal
    mode: remote
    replicas_per_actor: ${world.env_replicas_per_actor}
    placement: external
    external_hosts:
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-ga1024-a
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-ga1024-b
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-ga1024-c
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-ga1024-d
    external_start_port: 7777
    external_count: 12
    _target_: pipelinerl.domains.terminal.environment_server.TerminalEnvironmentServer
    bases_dir: ${oc.env:TERMINAL_BASES_DIR,/mnt/llmd/data/terminal_bases}
    cache_dir: ${output_dir}/env_cache
    rootfs_retention_seconds: 600.0
    n_envs: 1
    host: "0.0.0.0"
    proot_bin: ${oc.env:PROOT_BIN,/mnt/llmd/data/terminal_bin/proot}
    exec_mode: subprocess
    nameserver: ${oc.env:TERMINAL_NAMESERVER,10.150.0.10}
    command_timeout: 180.0
    verifier_timeout: 180.0
    max_observation_chars: 4000
    check_initial_state: true
    max_session_disk_bytes: 966367641   # 0.9 GiB
    session_delta_isolation: false
    session_delta_max_bytes: 536870912   # 512 MiB
    contamination_check: true
    contamination_sample_every: 20
    max_session_rss_bytes: 17179869184  # 16 GiB
    session_ttl_seconds: 2800.0
    session_reap_interval_seconds: 60.0
