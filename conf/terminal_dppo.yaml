defaults:
  - terminal_full_infra
  - _self_

# DPPO overlay run (2026-07-12). Single variable vs terminal_full_infra (fi03):
# finetune.rl.policy_loss gspo -> dppo (committed 3a1e160). fi03 format-collapsed
# (knee ~step 190-220, learned XML tool-schema drift under saturated GSPO updates;
# joint diagnosis in AGENT_CHAT <fi03-collapse-diagnosis>). DPPO's directional
# token-level trust-region gate blocks outside-region tokens moving away from the
# rollout policy, which targets exactly that scaffold-erosion dynamic.
# dppo_divergence_threshold stays at the 0.1 default (TMax recipe);
# relu_log_p_weights stays false so both bad_high and bad_low gates are active;
# epsilon_low/high are unused in the dppo path.
#
# The environments list is restated wholesale because OmegaConf replaces lists on
# merge; identical to terminal_full_infra apart from the dppo01 fleet hosts.

finetune:
  rl:
    policy_loss: dppo

orchestrator:
  fleet_name_prefix: terminal_envs_dppo01

environments:
  - key: terminal
    mode: remote
    replicas_per_actor: ${world.env_replicas_per_actor}
    placement: external
    external_hosts:
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo01-a
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo01-b
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo01-c
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo01-d
    external_start_port: 7777
    external_count: 12
    _target_: pipelinerl.domains.terminal.environment_server.TerminalEnvironmentServer
    bases_dir: ${oc.env:TERMINAL_BASES_DIR,/mnt/llmd/data/terminal_bases}
    cache_dir: ${output_dir}/env_cache
    rootfs_retention_seconds: 600.0
    n_envs: 1
    host: "0.0.0.0"
    proot_bin: ${oc.env:PROOT_BIN,/mnt/llmd/data/terminal_bin/proot}
    exec_mode: subprocess
    # P1a one-shot clean verifier, parity-validated 2026-07-09, live since fi03.
    clean_verifier: true
    nameserver: ${oc.env:TERMINAL_NAMESERVER,10.150.0.10}
    command_timeout: 180.0
    verifier_timeout: 180.0
    max_observation_chars: 4000
    check_initial_state: true
    max_session_disk_bytes: 966367641   # 0.9 GiB
    session_delta_isolation: false
    session_delta_max_bytes: 536870912   # 512 MiB
    contamination_check: true
    contamination_sample_every: 20
    max_session_rss_bytes: 17179869184  # 16 GiB
    session_ttl_seconds: 2800.0
    session_reap_interval_seconds: 60.0
    memory_evict_fraction: 0.9
    memory_resume_fraction: 0.75
