defaults:
  - terminal_dppo04
  - _self_

# dppo_05 / ARM 1 (2026-07-16). Single variable vs dppo_04: terminal.no_submit_penalty
# 0.2 -> 0. Checkpoint-probe diagnosis (AGENT_CHAT <dppo04-learning-forensics>): the
# penalty punishes an ABSENT action, so its gradient lands on random present commands
# (pure misattributed blame; upstream TMax has no such term), while the real submit
# erosion is interference on a scaffold trained in only ~3% of samples. Discriminator:
# submitted-rate trajectory vs dppo_04's 0.63->0.49 decline; counterfactual pass ~0.62.
# Arm 2 (submit-aware selector, review-gated) lands later as a single delta on this.

terminal:
  no_submit_penalty: 0.0

orchestrator:
  fleet_name_prefix: terminal_envs_dppo05

environments:
  - key: terminal
    mode: remote
    replicas_per_actor: ${world.env_replicas_per_actor}
    placement: external
    external_hosts:
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo05-a
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo05-b
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo05-c
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo05-d
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo05-e
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo05-f
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo05-g
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo05-h
    external_start_port: 7777
    external_count: 12
    _target_: pipelinerl.domains.terminal.environment_server.TerminalEnvironmentServer
    bases_dir: ${oc.env:TERMINAL_BASES_DIR,/mnt/llmd/data/terminal_bases}
    cache_dir: ${output_dir}/env_cache
    rootfs_retention_seconds: 600.0
    n_envs: 1
    host: "0.0.0.0"
    proot_bin: ${oc.env:PROOT_BIN,/mnt/llmd/data/terminal_bin/proot}
    exec_mode: subprocess
    clean_verifier: true
    nameserver: ${oc.env:TERMINAL_NAMESERVER,10.150.0.10}
    command_timeout: 180.0
    verifier_timeout: 180.0
    max_observation_chars: 4000
    check_initial_state: true
    max_session_disk_bytes: 966367641   # 0.9 GiB
    session_delta_isolation: false
    session_delta_max_bytes: 536870912   # 512 MiB
    contamination_check: true
    contamination_sample_every: 20
    max_session_rss_bytes: 17179869184  # 16 GiB
    session_ttl_seconds: 2800.0
    session_reap_interval_seconds: 60.0
    memory_evict_fraction: 0.9
    memory_resume_fraction: 0.75
