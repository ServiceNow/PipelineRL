defaults:
  - terminal_dppo02
  - _self_

# Post-fix DPPO baseline (2026-07-15). Single variable vs dppo_02:
# preprocess.rollout_turn_sampling all -> uniform_one (one CRC-selected turn per
# surviving rollout, atomic task-group envelopes, whole-group eviction only,
# sentinel-padded 128-sample updates). Lands on 45d14e3 (strict TITO daa2807 +
# uniform_one 45d14e3): exact vLLM token-ID capture is active for ALL runs from
# this commit. Runtime acceptance gates in AGENT_CHAT <trajectory-packing-design>:
# uniform_one startup log, ~8 task groups + >=120 rollouts per update, zero
# partial-group evictions, sentinel p95 <= 8/128.
#
# The environments list is restated wholesale because OmegaConf replaces lists on
# merge; identical to terminal_dppo02 apart from the dppo03 fleet hosts.

preprocess:
  rollout_turn_sampling: uniform_one

orchestrator:
  fleet_name_prefix: terminal_envs_dppo03

environments:
  - key: terminal
    mode: remote
    replicas_per_actor: ${world.env_replicas_per_actor}
    placement: external
    external_hosts:
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo03-a
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo03-b
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo03-c
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo03-d
    external_start_port: 7777
    external_count: 12
    _target_: pipelinerl.domains.terminal.environment_server.TerminalEnvironmentServer
    bases_dir: ${oc.env:TERMINAL_BASES_DIR,/mnt/llmd/data/terminal_bases}
    cache_dir: ${output_dir}/env_cache
    rootfs_retention_seconds: 600.0
    n_envs: 1
    host: "0.0.0.0"
    proot_bin: ${oc.env:PROOT_BIN,/mnt/llmd/data/terminal_bin/proot}
    exec_mode: subprocess
    clean_verifier: true
    nameserver: ${oc.env:TERMINAL_NAMESERVER,10.150.0.10}
    command_timeout: 180.0
    verifier_timeout: 180.0
    max_observation_chars: 4000
    check_initial_state: true
    max_session_disk_bytes: 966367641   # 0.9 GiB
    session_delta_isolation: false
    session_delta_max_bytes: 536870912   # 512 MiB
    contamination_check: true
    contamination_sample_every: 20
    max_session_rss_bytes: 17179869184  # 16 GiB
    session_ttl_seconds: 2800.0
    session_reap_interval_seconds: 60.0
    memory_evict_fraction: 0.9
    memory_resume_fraction: 0.75
