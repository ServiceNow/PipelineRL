# Qwen2.5-0.5B GSPO reinforcement-learning experiment (bf16, Fast-LLM trainer).
#
# Single committed source of truth for the run's hyperparameters. The launch script
# supplies only environment (model/output paths, W&B identity, caches) and calls:
#   python -m pipelinerl.launch --config-name math_qwen05_gspo
# Rationale for each value is in Fast-LLM docs/recipes/reinforcement-learning.md.
#
# Precision/engine variants (fp16/fp32-matched, DeepSpeed) can layer on top of this config
# by overriding compute_dtype + the vLLM dtype, or use_fast_llm + deepspeed_config.

defaults:
  - math
  - _self_

seed: 43
# Public HF id; override with a local snapshot path on the CLI if it can't be resolved.
model_path: Qwen/Qwen2.5-0.5B

# Topology: 7 vLLM actors + 1 Fast-LLM trainer on 8 GPUs (trainer FSDP size 1).
world:
  actor_fraction: 7
  preprocessor_fraction: 0
  finetune_fraction: 1

llm:
  parameters:
    max_tokens: 7000
    temperature: 0.7
test_llm:
  parameters:
    max_tokens: 7000
    temperature: 0.7

actor:
  llm_max_rollouts: 128

vllm_config:
  vllm_kwargs:
    max_model_len: 10000

# PipelineRL's own config: the DeepSpeed trainer AND the (backend-agnostic) preprocessor/RL
# data prep. With use_fast_llm=true the DeepSpeed *optimizer* fields here are ignored (the
# Fast-LLM trainer uses fast_llm.optimizer.* below) — so they're omitted; only the fields the
# FL run actually needs are set. Each is tagged: [preproc] runs regardless of backend,
# [orch] whole-pipeline, [DS-loss] DeepSpeed loss only (inert on the FL path). "== <x>" marks a
# value that MUST stay equal to its fast_llm counterpart (duplicated across the two backends).
finetune:
  seq_length: 10000              # [preproc] sample packing (preprocess.py). == fast_llm.data.micro_batch_size
  max_train_steps: 2000          # [orch]    == fast_llm.training.train_iters
  save_checkpoint_steps: 100     # [orch]    == fast_llm.training.checkpoint.interval
  attempts: 8                    # [orch]    rollouts (attempts) per problem
  rl:                            # RLConfig(**cfg.finetune.rl) built in preprocess.py:474
    policy_loss: gspo            # [DS-loss] inert on FL (FL loss = fast_llm...losses.grpo.type)
    epsilon_low: 0.003           # [DS-loss] inert on FL; FL clip = fast_llm...grpo.epsilon_low
    epsilon_high: 0.004          # [DS-loss] inert on FL; FL clip = fast_llm...grpo.epsilon_high
    group_normalization: false   # [preproc] advantage computation
    filter_zero_advantage_groups: true  # [preproc] drop all-zero-advantage groups

# Fast-LLM trainer config (written to a YAML at launch and passed to fast-llm). Used only when
# use_fast_llm=true; this is the FL backend's parallel of the finetune.* trainer config above.
fast_llm:
  training:
    train_iters: 2000            # == finetune.max_train_steps
    checkpoint:
      interval: 100              # == finetune.save_checkpoint_steps
  data:
    micro_batch_size: 10000  # tokens; must be >= the packed sequence length. == finetune.seq_length
  schedule:
    depth_first_micro_batches: 48
    docs_per_step: 256       # accumulate to this many rollouts, then step
  optimizer:
    learning_rate:
      base: 5.0e-7
      warmup_iterations: 0
      decay_style: constant
      decay_iterations: 400
    beta_1: 0.974004         # sqrt-rule, effective-batch multiplier m=4
    beta_2: 0.999750
    gradient_norm_clipping: 76.8   # 0.3 * docs_per_step
  model:
    distributed:
      sequence_data_parallel: 1
      timeout: 3600
    multi_stage:
      zero_stage: 1          # trainer is a single GPU (FSDP size 1) -> stage is a no-op
    base_model:
      head:
        fp32_lm_head: true
        losses:
          # Overrides PipelineRL's base `grpo` loss entry in place; `type: gspo` selects
          # GSPO. (The dict key stays `grpo`, so diagnostic metrics carry a `grpo_` prefix.)
          grpo:
            type: gspo
            epsilon_low: 0.003    # the LIVE clip on the FL path. == finetune.rl.epsilon_low
            epsilon_high: 0.004   # == finetune.rl.epsilon_high
            logits_scale_factor: 1.4285714   # = 1 / sampling temperature (0.7)
            metrics: basic                    # log staleness/clip/ratio/KL/advantage/reward
