defaults:
  - terminal_dppo
  - _self_

# dppo_02 (2026-07-13). Single variable vs dppo_01: finetune.gradient_clipping_threshold
# 0.1 -> 1.0 (TMax paper value). Threshold-sensitivity ablation, not a proven cause:
# clip=0.1 binds on ~98% of steps (pre-clip median norm 1.38 in fi01) but AdamW largely
# cancels per-step gradient scaling, so the residual effect is Adam moment/history
# distortion. Pre-registered reads: fmtX/stability, success slope, TV/mask + grad-norm
# trajectories. Note the DPPO mask gates diverged tokens but does not bound the
# aggregate step, so larger steps carry real drift risk - that is what this measures.
# dppo_01 cleared the fi03 collapse window (step 280, fmtX 0.006) before this launch.
#
# The environments list is restated wholesale because OmegaConf replaces lists on
# merge; identical to terminal_dppo apart from the dppo02 fleet hosts.

finetune:
  gradient_clipping_threshold: 1.0

orchestrator:
  fleet_name_prefix: terminal_envs_dppo02

environments:
  - key: terminal
    mode: remote
    replicas_per_actor: ${world.env_replicas_per_actor}
    placement: external
    external_hosts:
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo02-a
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo02-b
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo02-c
      - dns-${oc.env:EAI_ACCOUNT_ID}-terminal-envs-dppo02-d
    external_start_port: 7777
    external_count: 12
    _target_: pipelinerl.domains.terminal.environment_server.TerminalEnvironmentServer
    bases_dir: ${oc.env:TERMINAL_BASES_DIR,/mnt/llmd/data/terminal_bases}
    cache_dir: ${output_dir}/env_cache
    rootfs_retention_seconds: 600.0
    n_envs: 1
    host: "0.0.0.0"
    proot_bin: ${oc.env:PROOT_BIN,/mnt/llmd/data/terminal_bin/proot}
    exec_mode: subprocess
    clean_verifier: true
    nameserver: ${oc.env:TERMINAL_NAMESERVER,10.150.0.10}
    command_timeout: 180.0
    verifier_timeout: 180.0
    max_observation_chars: 4000
    check_initial_state: true
    max_session_disk_bytes: 966367641   # 0.9 GiB
    session_delta_isolation: false
    session_delta_max_bytes: 536870912   # 512 MiB
    contamination_check: true
    contamination_sample_every: 20
    max_session_rss_bytes: 17179869184  # 16 GiB
    session_ttl_seconds: 2800.0
    session_reap_interval_seconds: 60.0
    memory_evict_fraction: 0.9
    memory_resume_fraction: 0.75
